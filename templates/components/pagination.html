<div class="card-footer d-flex justify-content-between align-items-center"><span class="text-secondary small">{{ page_obj.paginator.count }} records · Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span><div class="btn-list">{% if page_obj.has_previous %}<a class="btn btn-sm" href="?{{ querystring }}&page={{ page_obj.previous_page_number }}">Previous</a>{% endif %}{% if page_obj.has_next %}<a class="btn btn-sm" href="?{{ querystring }}&page={{ page_obj.next_page_number }}">Next</a>{% endif %}</div></div>
