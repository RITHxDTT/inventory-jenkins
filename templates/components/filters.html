{% if filter %}<div class="card mb-3"><form method="get" class="card-body"><input type="hidden" name="kind" value="{{ kind }}"><div class="filter-grid">{% for field in filter.form %}<div><label class="form-label small" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}</div><div class="mt-3"><button class="btn btn-primary btn-sm">Apply filters</button><a class="btn btn-sm" href="{{ request.path }}{% if kind %}?kind={{ kind }}{% endif %}">Reset</a></div></form></div>{% endif %}
