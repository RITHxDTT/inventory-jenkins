{% extends 'base.html' %}{% block content %}<div class="login-panel"><div class="login-logo"><span class="brand-mark"><i class="bi bi-box-seam"></i></span> Stockroom</div><div class="card"><div class="card-body p-4"><h1 class="h2 text-center">Welcome back</h1><p class="text-secondary text-center mb-4">Sign in to your inventory workspace</p>{% if form.errors %}<div class="alert alert-danger">Your username or password is incorrect.</div>{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><label class="form-label" for="id_username">Username</label><input class="form-control mb-3" id="id_username" name="username" value="{{ form.username.value|default:'' }}" autocomplete="username" required autofocus><div class="d-flex justify-content-between"><label class="form-label" for="id_password">Password</label><a class="small" href="{% url 'password_reset' %}">Forgot password?</a></div><input class="form-control mb-4" id="id_password" name="password" type="password" autocomplete="current-password" required><button class="btn btn-primary w-100" type="submit">Sign in <i class="bi bi-arrow-right ms-2"></i></button></form></div></div><p class="text-secondary text-center mt-3 small">A clear view of every product. Confidence in every movement.</p></div>{% endblock %}
